# The smallest Solaria project: one agent and two environments.
#
# local uses the stub provider, which writes "host objects" to files under
# .solaria/stub/. It needs no credentials, so it's the place to try plan
# and apply:
#
#   solaria validate
#   solaria plan -e local
#   solaria apply -e local
#   solaria status
#   solaria destroy -e local
#
# local-gitagent builds the same agent into a gitagent container image with
# the local docker CLI. Planning needs nothing; apply needs Docker, and the
# first build takes several minutes. Running the image needs
# ANTHROPIC_API_KEY: apply prints the docker run command.
#
# local-sdk runs the same agent on the Claude Agent SDK as a local Node
# process. Planning needs Node 18.14 or later; apply installs the SDK from
# npm into a bundle under .solaria/claude-agent-sdk/ and prints the command
# that starts it. Running it needs ANTHROPIC_API_KEY, and nothing else from
# your environment or home folder reaches the run.
#
# ma-cloud deploys the same agent to Claude Managed Agents, which runs it on
# Anthropic's side. Planning needs nothing; apply and refresh need
# ANTHROPIC_API_KEY, and apply creates real objects: a Managed Agents
# environment and agent, both named hello-example-*. Destroy archives the
# agent, which can't be undone, and deletes the environment.
#
# ma-self-hosted is Managed Agents with the sandbox on this machine: apply
# also builds and runs a worker container, which needs Docker and the
# environment's key. The first apply creates the environment and stops to
# say how to get the key from the Claude Console.
apiVersion: solaria.sh/v1alpha1
kind: Agent
metadata:
  name: hello
spec:
  description: Says hello
  instructions: [instructions.md]
  model:
    preferred: anthropic:claude-haiku-5-5
  tools:
    builtin: [read]
  limits: {maxTurns: 5}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: local
spec:
  provider: stub
  placement: file
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: local-gitagent
spec:
  provider: gitagent
  placement: docker
  sandbox:
    network: {mode: unrestricted}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: local-sdk
spec:
  provider: claude-agent-sdk
  placement: process
  sandbox:
    network: {mode: unrestricted}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: ma-cloud
spec:
  provider: managed-agents
  placement: cloud
  providers:
    managed-agents: {namePrefix: hello-example-}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: ma-self-hosted
spec:
  provider: managed-agents
  placement: self-hosted
  providers:
    managed-agents: {namePrefix: hello-example-}
