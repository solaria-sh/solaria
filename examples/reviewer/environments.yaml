# One agent, three places to run it. Only these environments differ; the
# card in agent.yaml stays the same, and so does its specDigest.
#
# Every environment gets the same sandbox: ripgrep on top of the Solaria
# sandbox base, with package managers and GitHub reachable.

# A gitagent container image on this machine. Cheaper model for local runs.
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: local-gitagent
spec:
  provider: gitagent
  placement: docker
  sandbox:
    packages: {apt: [ripgrep]}
    network: {mode: limited, allow: [github.com], packageManagers: true}
  overrides:
    reviewer:
      model: {preferred: anthropic:claude-haiku-5-5}
---
# Claude Managed Agents: Anthropic runs the agent loop and the sandbox.
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: ma-cloud
spec:
  provider: managed-agents
  placement: cloud
  sandbox:
    packages: {apt: [ripgrep]}
    network: {mode: limited, allow: [github.com], packageManagers: true}
  providers:
    managed-agents: {namePrefix: reviewer-example-}
---
# Claude Managed Agents with the sandbox on this machine: Anthropic runs the
# agent loop, and a worker container here runs its tools.
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: ma-self-hosted
spec:
  provider: managed-agents
  placement: self-hosted
  sandbox:
    packages: {apt: [ripgrep]}
    network: {mode: limited, allow: [github.com], packageManagers: true}
  providers:
    managed-agents: {namePrefix: reviewer-example-}
