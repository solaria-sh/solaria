# One agent, three places to run it. Only these targets differ; the
# card in agent.yaml stays the same, and so does its specDigest.
#
# Every target gives the agent the same sandbox, the Environment at the
# end of this file.

# A gitagent container image on this machine. Cheaper model for local runs.
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata:
  name: local-gitagent
spec:
  provider: gitagent
  placement: docker
  environments: [{ref: review}]
  overrides:
    reviewer:
      model: {preferred: anthropic:claude-haiku-5-5}
---
# Claude Managed Agents: Anthropic runs the agent loop and the sandbox.
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata:
  name: ma-cloud
spec:
  provider: managed-agents
  placement: cloud
  environments: [{ref: review}]
  providers:
    managed-agents: {namePrefix: reviewer-example-}
---
# Claude Managed Agents with the sandbox on this machine: Anthropic runs the
# agent loop, and a worker container here runs its tools.
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata:
  name: ma-self-hosted
spec:
  provider: managed-agents
  placement: self-hosted
  environments: [{ref: review}]
  providers:
    managed-agents: {namePrefix: reviewer-example-}
---
# review is ripgrep on top of the Solaria sandbox base, with package
# managers and GitHub reachable. Each target builds it its own way: an
# image for docker, a Managed Agents environment for managed-agents.
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata:
  name: review
spec:
  packages: {apt: [ripgrep]}
  network: {mode: limited, allow: [github.com], packageManagers: true}
