name: Site

# Builds solaria.sh from site/ and docs/, checks every link, and deploys it to
# Cloudflare Pages: main goes to production, and each pull request from this
# repository gets a preview. Without the Cloudflare secret (forks, Dependabot,
# or before it's set up) the site is still built and checked, but not deployed.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'solaria' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: site/go.mod
          cache-dependency-path: site/go.sum
      - name: Check links
        run: go -C site test -count=1 .
      - name: Build
        run: go -C site run .
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: pages deploy site/public --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -n "$URL" ]; then
            echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Built and checked; not deployed because CLOUDFLARE_API_TOKEN isn't available to this run." >> "$GITHUB_STEP_SUMMARY"
          fi
