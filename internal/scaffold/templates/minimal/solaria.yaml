# yaml-language-server: $schema=https://solaria.sh/schemas/v1alpha1/solaria.json
#
# A Solaria project: one agent, and two targets to run it in.
#
#   solaria validate          check this file and the files it names
#   solaria plan -t local     show what apply would do
#   solaria apply -t local    deploy the agent with the stub provider
#   solaria status            show what is deployed where
#
# The Agent says what the agent is. It names no host: the targets below
# decide where it runs.
apiVersion: solaria.sh/v1alpha1
kind: Agent
metadata:
  name: hello
spec:
  description: Says hello
  instructions: [instructions.md]
  model:
    preferred: anthropic:claude-haiku-5-5
  tools:
    builtin: [read]
  limits: {maxTurns: 5}
---
# local uses the stub provider, which records what it deploys in files under
# .solaria/. It needs no credentials and nothing installed, so it's the place
# to try plan and apply.
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata:
  name: local
spec:
  provider: stub
  placement: file
---
# local-sdk runs the same agent on the Claude Agent SDK as a local Node
# process. Planning needs Node 18.14 or later; apply installs the SDK into
# .solaria/. Running the agent needs ANTHROPIC_API_KEY, and
# `solaria status -t local-sdk -a hello` shows the command that starts it.
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata:
  name: local-sdk
spec:
  provider: claude-agent-sdk
  placement: process
  sandbox:
    network: {mode: unrestricted}
