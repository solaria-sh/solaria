apiVersion: solaria.sh/v1alpha1
kind: Agent
metadata: {name: helper}
spec:
  instructions: [role.md]
  model: {preferred: anthropic:claude-haiku-5-5}
  tools:
    builtin: [read, glob, web_fetch]
    mcp: [{ref: notes}]
  output:
    schema:
      type: object
      properties:
        answer: {type: string}
      required: [answer]
  providers:
    claude-agent-sdk: {colour: blue}
---
apiVersion: solaria.sh/v1alpha1
kind: McpServer
metadata: {name: notes}
spec:
  packages: [{registryType: pypi, identifier: notes-mcp, version: "0.4.1", transport: {type: stdio}}]
---
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata: {name: ci}
spec:
  provider: claude-agent-sdk
  placement: process
  environments: [{ref: ci}]
  providers:
    claude-agent-sdk: {runtime: python, version: 0.2.170}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata: {name: ci}
spec:
  packages: {apt: [jq]}
  resources: {memory: 2Gi}
---
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata: {name: ci-docker}
spec:
  provider: claude-agent-sdk
  placement: docker
  environments: [{ref: ci-docker}]
  providers:
    claude-agent-sdk: {runtime: python}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata: {name: ci-docker}
spec:
  image: ./sandbox.Dockerfile
  network: {mode: unrestricted}
