apiVersion: solaria.sh/v1alpha1
kind: Agent
metadata: {name: reviewer}
spec:
  description: Reviews pull requests.
  instructions: [role.md, rules.md]
  model:
    preferred: anthropic:claude-sonnet-5-5
    fallback: [anthropic:claude-haiku-5-5, openai:gpt-6-astra]
    effort: high
  tools:
    builtin: [shell, read, edit, grep]
    mcp:
      - {ref: github, allowTools: [create_issue, get_pull_request]}
      - {ref: docs}
  skills: [skills/triage]
  permissions: {ask: [shell, github/create_issue]}
  limits: {maxTurns: 40, timeout: 15m}
  output: {schema: review.schema.yaml}
---
apiVersion: solaria.sh/v1alpha1
kind: McpServer
metadata: {name: github}
spec:
  packages:
    - registryType: npm
      identifier: "@modelcontextprotocol/server-github"
      version: "2025.4.8"
      transport: {type: stdio}
      packageArguments: [{type: named, name: --toolsets, value: issues}]
      environmentVariables: [{name: GITHUB_PERSONAL_ACCESS_TOKEN, secretRef: GITHUB_TOKEN}]
---
apiVersion: solaria.sh/v1alpha1
kind: McpServer
metadata: {name: docs}
spec:
  packages: [{registryType: pypi, identifier: docs-mcp, version: "1.2.0", transport: {type: stdio}}]
  remotes:
    - type: sse
      url: https://docs.example.com/sse
    - type: streamable-http
      url: https://docs.example.com/mcp
      headers: [{name: Authorization, secretRef: DOCS_TOKEN}, {name: X-Team, value: platform}]
---
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata: {name: dev}
spec:
  provider: claude-agent-sdk
  placement: process
  environments: [{ref: dev}]
  secrets: {source: dotenv}
  telemetry:
    endpoint: http://localhost:4318
    protocol: http/protobuf
    headers: [{name: x-tenant, value: acme}]
    resourceAttributes: {service.namespace: platform, team: "code review, core"}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata: {name: dev}
spec:
  network: {mode: unrestricted}
---
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata: {name: dev-docker}
spec:
  provider: claude-agent-sdk
  placement: docker
  environments: [{ref: dev-docker}]
  secrets: {source: dotenv}
  telemetry: {endpoint: "http://localhost:4318"}
  providers:
    claude-agent-sdk: {platform: linux/arm64}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata: {name: dev-docker}
spec:
  packages: {apt: [jq], cargo: [ripgrep@14.1.0]}
  resources: {memory: 4Gi, disk: 20Gi}
---
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata: {name: dev-srt}
spec:
  provider: claude-agent-sdk
  placement: process
  environments: [{ref: dev-srt}]
  secrets: {source: dotenv}
  telemetry: {endpoint: "http://localhost:4318"}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata: {name: dev-srt}
spec:
  isolation: srt
  network: {allow: [git.example.com]}
---
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata: {name: srt-read-only}
spec:
  provider: claude-agent-sdk
  placement: process
  environments: [{ref: srt-read-only}]
  inputs:
    workspace: {path: product}
  overrides:
    reviewer:
      workspace: {access: read-only}
---
apiVersion: solaria.sh/v1alpha1
kind: Environment
metadata: {name: srt-read-only}
spec: {isolation: srt}
---
apiVersion: solaria.sh/v1alpha1
kind: Target
metadata: {name: docker-read-only}
spec:
  provider: claude-agent-sdk
  placement: docker
  inputs:
    workspace: {path: product}
  overrides:
    reviewer:
      workspace: {access: read-only}
